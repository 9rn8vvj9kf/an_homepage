<P><B><FONT SIZE=+3>海外との金銭貸借・対外直接投資の自由化について<BR>
</FONT></B>　<B><FONT SIZE=+1>現　状（３／３１迄）<BR>
</FONT></B>　　居住者が非居住者に対する金銭の貸付をする場合、非居住者からの居住者の借入<BR>
　　は１億円を越える場合は大蔵省への事前届け出が必要。<BR>
<BR>
　<B><FONT SIZE=+1>外為法改正後（９８年４月１日以降）<BR>
</FONT></B>　　上記の件について事前届出制は廃止され、事後報告制となると予想される。<BR>
<BR>
<B><FONT SIZE=+1>海外との金銭貸借・対外直接投資の自由化に伴うメリット<BR>
</FONT></B>　　　１．事前届出なしで海外への資本金等の出資が可能となるので、海外進出が容易になる。<BR>
　　　２．事前届出なしで海外への金銭貸付が行えるので、海外投資が容易になる。<BR>
