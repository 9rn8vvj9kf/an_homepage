<P><B><FONT SIZE=7>交互計算による代金決済自由化</FONT></B><BR>
<BR>
<B><FONT SIZE=5>交互計算の意義</FONT></B><BR>
　　企業間の外国為替取引を発生の都度決済せずに、一定期間の取引から発生する<BR>
　　債権債務を相殺し、差額金額のみ決済を行うことを云います。<BR>
<BR>
<BR>
<B><FONT SIZE=4>交互計算のメリット</FONT></B><BR>
　　１．従来その都度決済を要する債権債務を一定期間まとめて相殺するので、外為手数料<BR>
　　　　の削減効果が多大のものとなる<BR>
<BR>
　　 ２．グループ企業の債権債務、為替リスクの管理が可能となります<BR>
<BR>
　　 ３．資金の効率向上・合理化が可能となります。<BR>
<BR>
<BR>
<B><FONT SIZE=5>改正後の動向</FONT></B><BR>
　　　交互計算は現在の許可が不要となり、事後報告のみとなると予想されます。<BR>
